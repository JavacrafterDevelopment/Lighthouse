<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lighthouse</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">

    <!-- One masthead: the lamp stands full height on the left, wordmark and search
         stacked beside it, window buttons pinned to the corner. Same controls as
         before, just given room so the beam is actually legible. -->
    <header id="top">
      <svg id="lamp-mark" width="62" height="62" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="beamFade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"   stop-color="#A8843F" stop-opacity=".50"/>
            <stop offset=".55" stop-color="#A8843F" stop-opacity=".16"/>
            <stop offset="1"   stop-color="#A8843F" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="lampGlow">
            <stop offset="0" stop-color="#C79A4A" stop-opacity=".5"/>
            <stop offset="1" stop-color="#C79A4A" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- Drawn before the tower so the tower occludes it as it swings past. -->
        <g class="beam">
          <path d="M32 20 L64 8 L64 32 Z" fill="url(#beamFade)"/>
        </g>
        <circle class="glow" cx="32" cy="20" r="12" fill="url(#lampGlow)"/>

        <rect class="structure" x="16" y="54" width="32" height="5" rx="2"/>
        <path class="tower" d="M26 27 h12 l4 27 H22 z"/>
        <path class="band" d="M25 34 h14 M24 42.5 h16" stroke-width="3.4"/>
        <path class="structure" d="M30 54 v-5.4 a2 2 0 0 1 4 0 V54 z"/>

        <rect class="structure" x="20.5" y="24.2" width="23" height="3.2" rx="1.3"/>
        <rect class="structure" x="25" y="14" width="14" height="10.4"/>
        <circle class="lamp" cx="32" cy="19.6" r="3.7"/>
        <path class="structure" d="M22.6 14 h18.8 L32 5.6 z"/>
        <circle class="structure" cx="32" cy="4" r="1.5"/>
      </svg>

      <div id="brandcol">
        <div id="brandrow">
          <span id="wordmark">Light<span class="beam">house</span></span>
          <button id="gear" title="Settings">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M8 1.4v1.7M8 12.9v1.7M14.6 8h-1.7M3.1 8H1.4M12.7 3.3l-1.2 1.2M4.5 11.5l-1.2 1.2M12.7 12.7l-1.2-1.2M4.5 4.5L3.3 3.3"
                    stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <div id="searchrow">
          <div id="searchwrap">
            <span class="glass">
              <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
                <circle cx="6.4" cy="6.4" r="4.6" stroke="currentColor" stroke-width="1.4"/>
                <path d="M9.9 9.9l3.4 3.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </span>
            <input id="q" type="text" spellcheck="false" autocomplete="off"
                   placeholder="Search every file and folder…" autofocus>
            <button id="clear" title="Clear">
              <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            </button>
          </div>

          <div class="chips">
            <button class="chip" data-filter="tidy" data-value="on"
                    title="Hide the machinery — system files, build output, package caches and the folders they live in">Tidy</button>
            <span class="chip-sep"></span>
            <button class="chip" data-filter="types" data-value="apps" title="Only things you can run — programs and shortcuts">Apps</button>
            <button class="chip" data-filter="types" data-value="folders" title="Only folders">Folders</button>
            <button class="chip" data-filter="types" data-value="files" title="Only files">Files</button>
            <button class="chip" data-filter="mode" data-value="startsWith" title="Match only names that begin with what you type">Starts with</button>
          </div>
        </div>
      </div>

      <div id="winbtns">
        <button class="winbtn" data-win="minimize" title="Minimise">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5h8" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <button class="winbtn" data-win="maximize" title="Maximise">
          <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1.2" y="1.2" width="7.6" height="7.6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <button class="winbtn close" data-win="close" title="Close to tray">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.4 1.4l7.2 7.2M8.6 1.4L1.4 8.6" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
      </div>
    </header>

    <div id="columns">
      <span>Name</span>
      <span>Type</span>
      <span class="num">Size</span>
      <span class="num">Modified</span>
    </div>

    <div id="body">
      <div id="scroller">
        <div id="sizer"><div id="rows"></div></div>
      </div>

      <div id="empty" class="on">
        <svg width="42" height="48" viewBox="0 0 17 19" fill="none" opacity=".5">
          <path d="M6.6 6.6h3.8l1.5 10.9H5.1L6.6 6.6z" fill="#8C7A66"/>
          <rect x="6.1" y="4.2" width="4.8" height="2.2" rx=".6" fill="#8C7A66"/>
          <circle cx="8.5" cy="2.6" r="1.5" fill="#A8843F"/>
          <path d="M3.6 17.5h9.8" stroke="#8C7A66" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <h2 id="emptyTitle">Building the index</h2>
        <p id="emptyText">Reading the file table straight off your drives. This usually takes a few seconds.</p>
      </div>
    </div>

    <div id="status">
      <span id="lamp" class="scanning"></span>
      <span id="statusText">Starting up</span>
      <button id="reindex" title="Scan every drive again from scratch">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path d="M10.4 6a4.4 4.4 0 1 1-1.3-3.1" stroke="currentColor" stroke-width="1.3"
                stroke-linecap="round" fill="none"/>
          <path d="M10.6 1.1v2.6H8" stroke="currentColor" stroke-width="1.3"
                stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        Re-index
      </button>
      <span class="grow"></span>
      <span id="counts"></span>
    </div>

  </div>

  <!-- Populated at right-click time from Explorer's own context menu. -->
  <div id="menu" class="ctxmenu"></div>

  <div id="setwrap">
    <div id="settings" role="dialog" aria-label="Settings">
      <div class="set-head">
        <h2>Settings</h2>
        <button id="set-close" title="Close">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>

      <!-- The label points at the input by id rather than wrapping it: nesting makes
           a click on the switch itself ambiguous and can toggle twice. -->
      <div class="set-row">
        <label class="set-text" for="set-tray">
          <span class="set-title">Keep running when closed</span>
          <span class="set-desc">The window hides to the tray, so the index survives and
            Ctrl+Shift+Space stays instant. Turn this off and the close button quits
            Lighthouse outright.</span>
        </label>
        <input type="checkbox" id="set-tray" class="switch">
      </div>

      <div class="set-row">
        <label class="set-text" for="set-dark">
          <span class="set-title">Dark mode</span>
          <span class="set-desc">The same walnut and gilt, dimmed for reading at night.</span>
        </label>
        <input type="checkbox" id="set-dark" class="switch">
      </div>

      <p class="set-foot">Kept in <code>data\settings.json</code> beside the app, so your
        choices travel with the folder.</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
